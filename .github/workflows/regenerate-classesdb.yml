name: Regenerate classesdb

# Rebuild classesdb.lisp-sexp from the class metadata the tecgraf-iup
# release archives now ship at share/iup/classes.sexp, written there by that
# repository's iup_classdump as part of its own build.
#
# This replaces a chained three-platform workflow that introspected a
# running IUP over FFI -- a GUI session per platform, xvfb, internal SDK
# symbols, and artifacts handed job to job. Metadata produced by and shipped
# with the exact build it describes cannot drift from it, so all that
# remains here is: download three archives, extract three files, run a pure
# list transformation. One job, no display, a few seconds of Lisp.
#
# Manual trigger; the output is a checked-in file, uploaded for review and
# commit rather than pushed to master.

on:
  workflow_dispatch:

env:
  IUP_VERSION: v2.1.0

jobs:
  regenerate:
    name: Transform the shipped metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install SBCL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sbcl unzip

      - name: Extract the three platforms' class metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dumps
          for asset in linux-amd64 macos-arm64; do
            f="tecgraf-iup-${IUP_VERSION}-${asset}.tar.gz"
            gh release download "$IUP_VERSION" --repo lispnik/tecgraf-iup --pattern "$f" --dir . --clobber
            tar -xzf "$f" -O share/iup/classes.sexp > "dumps/${asset}.sexp"
          done
          f="tecgraf-iup-${IUP_VERSION}-windows-x64.zip"
          gh release download "$IUP_VERSION" --repo lispnik/tecgraf-iup --pattern "$f" --dir . --clobber
          unzip -p "$f" share/iup/classes.sexp > dumps/windows-x64.sexp
          wc -c dumps/*.sexp

      - name: Install and configure ocicl
        run: |
          git clone --depth 1 https://github.com/ocicl/ocicl.git "$HOME/ocicl-src"
          ( cd "$HOME/ocicl-src" && sbcl --non-interactive --load setup.lisp )
          bin="$(find "$HOME" -type f -name ocicl 2>/dev/null | grep -v '/ocicl-src/' | head -1)"
          test -n "$bin" || { echo "ocicl binary not found"; exit 1; }
          dirname "$bin" >> "$GITHUB_PATH"

      - name: Restore dependencies
        run: ocicl setup && ocicl install

      - name: Transform
        run: |
          sbcl --non-interactive \
            --eval '(require :asdf)' \
            --eval "(asdf:initialize-source-registry '(:source-registry (:tree \"$PWD\") :ignore-inherited-configuration))" \
            --eval '(asdf:load-system :iup-classesdb)' \
            --eval '(iup-classesdb:regenerate-from-dumps
                      #p"dumps/linux-amd64.sexp"
                      #p"dumps/macos-arm64.sexp"
                      #p"dumps/windows-x64.sexp")'
          head -1 classesdb.lisp-sexp
          git --no-pager diff --stat classesdb.lisp-sexp

      - uses: actions/upload-artifact@v4
        with:
          name: classesdb-regenerated
          path: classesdb.lisp-sexp
          if-no-files-found: error
